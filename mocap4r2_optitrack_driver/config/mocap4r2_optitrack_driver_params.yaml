mocap4r2_optitrack_driver_node:
  ros__parameters:
    connection_type: "Multicast" # Unicast / Multicast
    server_address: "192.168.11.51"
    local_address: "192.168.11.202"
    multicast_address: "239.255.42.99"
    server_command_port: 1510
    server_data_port: 1511
    # Not read by the driver: it names each body by its Motive streaming id (callm2
    # streams as "69"), and RMB_CallM picks the robot with mocap_rigid_body_id.
    rigid_body_name: "callm2"
    lastFrameNumber: 0
    frameCount: 0
    droppedFrameCount: 0
    n_markers: 6
    n_unlabeled_markers: 0
    qos_history_policy: "keep_all"         # keep_all / keep_last
    qos_reliability_policy: "best_effort"  # best_effort / reliable
    qos_depth: 10                         # 10 / 100 / 1000
